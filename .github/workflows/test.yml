name: Run Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Setup SQLite
        run: |
          rm -f sqlite.db
          bun run drizzle:migrate

      - name: Run tests
        run: bun test --bail
        env:
          BUN_ENV: test
